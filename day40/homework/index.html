<head>

    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Football_%28soccer_ball%29.svg"
         width="250"
         style="border: 5px solid black;">

    <br><br>

    <button style="color: white; font-size: 20px; background-color: green; border: 3px solid black; padding: 10px;">
        მეტი ინფორმაცია
    </button>

    <button style="color: black; font-size: 20px; background-color: orange; border: 3px solid blue; padding: 10px;">
        შემომიერთდი
    </button>
