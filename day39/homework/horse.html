<!DOCTYPE html>
<html>
<head>
    <title>ჩემი ცხენი</title>
</head>

<body style="background-color: yellow; margin: 0; padding: 0;">

    
    <h1 style="color: blue; font-size: 56px; text-align: center;">
        ჩემი საყვარელი ცხოველი
    </h1>

    
    <section id="horse" style="padding: 20px;">

        <h2 style="color: blue; font-size: 56px; text-align: center;">
            ცხენი
        </h2>

        <img src="https://via.placeholder.com/300x200"
             alt="ცხენი"
             style="border: 2px solid red; display: block; margin: 0 auto;">

        <p style="font-size: 22px; color: purple; background-color: green;
                  border: 1px solid red; text-align: center; margin-top: 20px;">
            ცხენი არის  ჩემთვის ყველაფერი მაგალითად როცა ვზივარ
             მე დიდ ადრენალინს მანიჭებს და ჩემი რცჰევა იქნება გამოცადონ სხვებმაც
        </p>
    </section>

        <div style="text-align: center; margin-top: 20px;">
        <label for="choose" style="font-size: 22px;">აირჩიე ცხენის ფერი:</label>
        <select id="choose" style="padding: 10px; font-size: 18px;">
            <option>შავი</option>
            <option>ყავისფერი</option>
            <option>თეთრი</option>
            <option>ნარინჯისფერი</option>
        </select>
    </div>

   
</body>
</html>
