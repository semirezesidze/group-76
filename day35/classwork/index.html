<head>
<meta charset="UTF-8">
<title>Table Without CSS</title>
</head>
<body>

<h2>Default table</h2>

<table border="1">
  <tr>
    <th>Header1</th>
    <th>Header2</th>
    <th>Header3</th>
  </tr>
  <tr>
    <td>Row1, Cell1</td>
    <td>Row1, Cell2</td>
    <td>Row1, Cell3</td>
  </tr>
  <tr>
    <td>Row2, Cell1</td>
    <td>Row2, Cell2</td>

  </tr>

</table>

  </tr>
  <tr>
    <td>Row1, Cell1</td>
    <td>Row1, Cell2</td>

  </tr>
  <tr>
    <td>Row2, Cell1</td>

  </tr>
  <tr>

    <td>Row3, Cell3</td>
  </tr>
</table>

</body>
